<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rasscheet — Рассылка</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px system-ui,Arial,sans-serif;background:#eef2f4;color:#294057;display:grid;place-items:center;padding:24px}main{width:min(680px,100%);background:#fff;border:1px solid #d6e1e6;border-radius:22px;padding:24px;box-shadow:0 12px 35px #29405718}h1{margin:0 0 6px;font-size:28px}p{color:#66798b;line-height:1.5}label{display:block;font-weight:700;margin:18px 0 7px}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #cbd8df;border-radius:12px;padding:12px;color:#294057;background:#fff}textarea{min-height:180px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}button{border:0;border-radius:12px;padding:12px 16px;background:#58619a;color:#fff;font-weight:750;cursor:pointer}button.secondary{background:#e7edf1;color:#40566b}button:disabled{opacity:.55}.count{margin-top:12px;font-weight:700}.result{margin-top:16px;padding:12px;border-radius:12px;background:#f2f6f7;white-space:pre-wrap}.warn{font-size:13px;color:#8a5b42}</style></head><body><main><h1>📢 Рассылка Rasscheet</h1><p>Сообщение отправляется пользователям с активной лицензией через Telegram-бота.</p><label>Секрет администратора</label><input id="secret" type="password" autocomplete="off" placeholder="ADMIN_SECRET"><label>Сообщение</label><textarea id="text" maxlength="4096" placeholder="Например: Вышло обновление Rasscheet 0.2!"></textarea><div class="row"><button class="secondary" id="count">Проверить получателей</button><button id="send">Отправить всем</button></div><div class="count" id="recipients"></div><p class="warn">Перед отправкой проверь текст: сообщение уйдёт всем Telegram ID с активной лицензией.</p><div class="result" id="result">Готово к работе.</div></main><script>
const $=s=>document.querySelector(s),secret=$('#secret'),text=$('#text'),recipients=$('#recipients'),result=$('#result'),countBtn=$('#count'),sendBtn=$('#send');
async function call(method,body){const r=await fetch('/.netlify/functions/admin-broadcast',{method,headers:{'x-admin-secret':secret.value,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Ошибка сервера');return j}
countBtn.onclick=async()=>{try{const j=await call('GET');recipients.textContent='Получателей: '+j.recipients;result.textContent='Количество получателей проверено.'}catch(e){result.textContent=e.message}};
sendBtn.onclick=async()=>{if(!secret.value){result.textContent='Введи секрет администратора.';return}if(!text.value.trim()){result.textContent='Введите сообщение.';return}if(!confirm('Отправить это сообщение всем пользователям с активной лицензией?'))return;sendBtn.disabled=true;countBtn.disabled=true;result.textContent='Рассылаем…';try{const j=await call('POST',{text:text.value.trim()});recipients.textContent='Получателей: '+j.total;result.textContent=`Отправлено: ${j.sent}\nОшибок: ${j.failed}`+(j.errors?.length?'\n\nПервые ошибки:\n'+j.errors.map(x=>x.telegram_id+': '+x.error).join('\n'):'')}catch(e){result.textContent=e.message}finally{sendBtn.disabled=false;countBtn.disabled=false}};
</script></body></html>
