<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Rasscheet 0.1 — iPhone</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px system-ui,Arial;color:#574669;background:radial-gradient(ellipse at 15% 8%,#ffb9d5,transparent 42%),radial-gradient(ellipse at 85% 20%,#bca4e9,transparent 45%),linear-gradient(#d5a5d9,#f5c4d1 48%,#8b83bb);background-attachment:fixed}#app{max-width:1050px;margin:auto;padding:18px 14px 65px}.hero{text-align:center;color:white;padding:48px 0 30px}.logo{font:normal clamp(52px,12vw,88px) Georgia,serif;text-shadow:0 4px 16px #73538d}.tag{font:italic 19px Georgia,serif;margin:12px}.flower{font-size:34px;letter-spacing:13px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{min-height:180px;border:0;border-radius:23px;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 12px 28px #70558a55}.tile svg{width:120px;height:80px}.tile h2{font:normal clamp(17px,4vw,25px) Georgia,serif;color:white;margin:10px 0}.blue{background:linear-gradient(140deg,#a0bdf0,#678fd1)}.pink{background:linear-gradient(140deg,#f2abc8,#d879a9)}.teal{background:linear-gradient(140deg,#8bd5cd,#58a9ae)}.rose{background:linear-gradient(140deg,#f4b8c5,#b979b6)}.violet{background:linear-gradient(140deg,#b8a6e6,#8a75c5)}.top{display:flex;align-items:center;gap:12px;margin:5px 0 22px;color:#fff}.top h1{font:normal clamp(24px,6vw,38px) Georgia,serif;margin:0}.back{border:0;border-radius:50%;background:#ffffffd9;color:#775e98;width:43px;height:43px;font-size:25px}.panel{background:#fffafef2;border:1px solid #fff;border-radius:22px;padding:18px;margin:15px 0;box-shadow:0 9px 26px #74578b30}.panel h3{font:normal 24px Georgia,serif;color:#805fa4;margin:0 0 14px}.panel h4{color:#8064a0;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:11px 0}.field{display:flex;flex:1;min-width:125px;flex-direction:column;gap:5px}label{font-size:13px;font-weight:650;color:#766385}input,select{width:100%;padding:11px 9px;border:1px solid #d7c4e3;border-radius:10px;background:white;color:#493951;font-size:15px}input[type=checkbox]{width:auto}.dms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.dms input{text-align:center;min-width:0}.btn{border:0;background:#9175bc;color:white;border-radius:11px;padding:12px 15px;font-size:14px;font-weight:700}.btn.alt{background:#56a6a4}.btn.del{background:#cb8194}.btn.soft{background:#eee4f5;color:#745a94}.btn.big{font-size:18px;padding:15px 23px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.item{border:1px solid #e8d9ef;border-radius:15px;padding:13px;margin:12px 0;background:#fff}.itemhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.itemhead strong{color:#8767a5}.muted{color:#8b7b98;font-size:13px;line-height:1.55}.notice{background:#f6ebf6;border-radius:12px;padding:12px;line-height:1.55}.project{background:#fff;border:1px solid #eadfed;border-radius:15px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.project small{display:block;color:#9485a0;margin-top:6px}.project strong{overflow-wrap:anywhere}.result{white-space:pre-wrap;line-height:1.75;font-size:14px}.diagram{width:100%;height:auto;min-height:320px;background:#fff;border:1px solid #ebdfee;border-radius:15px;margin:12px 0}.error{padding:12px;background:#fff0f1;color:#a34561;border-radius:12px;white-space:pre-wrap}.success{padding:12px;background:#e6f5ed;color:#3e7565;border-radius:12px}.hidden{display:none}.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.tile{min-height:157px}.tile svg{width:92px;height:65px}.panel{padding:14px}.project{align-items:flex-start;flex-direction:column}}
</style><style id="guide-easter-egg">
.guide-easter-wrap{position:relative;margin-top:34px;padding-top:18px;isolation:isolate}
.guide-easter-wrap .help-entry{margin-top:0;min-height:74px;padding-right:104px;text-align:left;position:relative;z-index:1}
.guide-easter-mascot{position:absolute;z-index:2;right:-21px;bottom:31px;width:153px;height:auto;object-fit:contain;object-position:bottom;pointer-events:none;image-rendering:auto;filter:drop-shadow(0 5px 5px #243a5433);transform:rotate(1deg)}
@media(max-width:430px){.guide-easter-wrap{margin-top:27px}.guide-easter-wrap .help-entry{padding-right:80px;font-size:14px}.guide-easter-wrap .help-entry span{font-size:10px}.guide-easter-mascot{width:124px;right:-12px;bottom:31px}}
@media(prefers-reduced-motion:no-preference){.guide-easter-mascot{animation:guide-idle 4s ease-in-out infinite}@keyframes guide-idle{0%,100%{transform:rotate(2deg) translateY(0)}50%{transform:rotate(1deg) translateY(-3px)}}}
</style><style>html,body{overscroll-behavior-y:contain}body{padding-bottom:env(safe-area-inset-bottom)}</style>
</head><body><div id="app"></div><script>
'use strict';
const $=s=>document.querySelector(s), app=$('#app'), R=Math.PI/180, TYPES={pgz:'ПГЗ',ogz:'ОГЗ',traverse:'Теодолитный ход',arbitrary:'Произвольный ход',level:'Нивелирование'};
let section=null,project=null,result=null,dirty=false;
const id=()=> 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const n=x=>x===''||x==null?NaN:Number(String(x).replace(',','.'));
const f=(x,d=3)=>Number.isFinite(x)?x.toFixed(d):'—';
const norm=x=>((x%360)+360)%360, diff=x=>norm(x+180)-180;
const dms=(d=0,m=0,s=0)=>({d,m,s});
const deg=x=>n(x.d||0)+n(x.m||0)/60+n(x.s||0)/3600;
function ds(v){let sign=v<0?'−':'';v=Math.abs(v);let D=Math.floor(v),M=Math.floor((v-D)*60),S=Math.round((v-D-M/60)*360000)/100;if(S>=60){S-=60;M++}if(M>=60){M-=60;D++}return sign+D+'° '+M+'′ '+f(S,2)+'″'}
const field=(label,path,value,type='number')=>`<div class="field"><label>${esc(label)}</label><input type="${type}" data-path="${esc(path)}" value="${esc(value??'')}"></div>`;
const angle=(label,path,v)=>`<div class="field"><label>${esc(label)}</label><div class="dms">${['d','m','s'].map((k,i)=>`<input type="number" step="any" placeholder="${['°','′','″'][i]}" data-path="${path}.${k}" value="${esc(v?.[k]??0)}">`).join('')}</div></div>`;
const sel=(label,path,value,options)=>`<div class="field"><label>${esc(label)}</label><select data-path="${esc(path)}">${options.map(([v,t])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
const btn=(label,action,cl='',extra='')=>`<button class="btn ${cl}" data-action="${action}" ${extra}>${esc(label)}</button>`;
const head=(name,back)=>`<div class="top"><button class="back" data-action="${back}">‹</button><h1>${esc(name)}</h1></div>`;
const loadAll=()=>{try{let x=JSON.parse(localStorage.getItem('rasschet_projects_v1')||'[]');return Array.isArray(x)?x:[]}catch{return []}};
function storeAll(x){localStorage.setItem('rasschet_projects_v1',JSON.stringify(x))}
function home(){section=null;project=null;result=null;dirty=false;app.innerHTML=`<div class="fade"><div class="hero"><div class="flower">✿ ❀ ✿</div><div class="logo">Rasschet</div><div class="tag">Калькулятор — твой лучший друг</div><div style="color:white;margin-bottom:24px">✦ Офлайн · 5 разделов · История и чертежи ✦</div></div><div class="cards">${[['pgz','blue','M12 70L105 15M12 70H105M105 15V70'],['ogz','pink','M12 65L105 20M12 65H105M105 20V65'],['traverse','teal','M8 55L40 14L75 65L110 24'],['arbitrary','violet','M10 15L60 43L105 9M60 43L35 73L106 69'],['level','rose','M9 58L40 33L65 47L108 16']].map(([t,c,path])=>`<button class="tile ${c}" data-action="section" data-type="${t}"><svg viewBox="0 0 120 85" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg><h2>${TYPES[t].toUpperCase()}</h2></button>`).join('')}</div></div>`}
function projects(t){section=t;project=null;result=null;dirty=false;const all=loadAll().filter(p=>p.type===t).sort((a,b)=>(b.modified||0)-(a.modified||0));app.innerHTML=`<div class="fade">${head(TYPES[t],'home')}<div class="panel"><h3>Мои проекты (${all.length})</h3>${all.length?all.map(p=>`<div class="project"><div><strong>${esc(p.name)}</strong><small>${esc(new Date(p.modified||Date.now()).toLocaleString('ru-RU'))}</small></div><div class="actions">${btn('Открыть','open','',`data-id="${esc(p.id)}"`)}${btn('Удалить','delete','del',`data-id="${esc(p.id)}"`)}</div></div>`).join(''):'<p class="muted">Проектов пока нет. Создай первый ✿</p>'}<div class="actions">${btn('＋ Новый проект','new')}${btn('Экспорт JSON','export','alt')}${btn('Импорт JSON','import','soft')}</div></div></div>`}
function make(t){const p={id:id(),name:'Новый проект',type:t,modified:Date.now(),data:{}};let d=p.data;if(t==='pgz')Object.assign(d,{x:1000,y:1000,az:dms(45),s:100});if(t==='ogz')Object.assign(d,{x1:1000,y1:1000,x2:1100,y2:1100});if(t==='traverse')Object.assign(d,{closed:true,side:'right',x:1000,y:1000,az:dms(45),endKnown:false,endX:1000,endY:1000,endAzKnown:false,endAz:dms(),lines:[{name:'1–2',s:100,beta:dms(60)},{name:'2–3',s:100,beta:dms(60)},{name:'3–1',s:100,beta:dms(60)}]});if(t==='level')Object.assign(d,{startName:'Рп 1',startH:100,endKnown:true,endName:'Рп 2',endH:100.45,tolerance:10,stations:[{name:'Ст. 1',back:1.425,front:1.215,distance:60},{name:'Ст. 2',back:1.355,front:1.115,distance:70}]});if(t==='arbitrary'){const q=['Опорная','Начальная','I','II'].map((name,i)=>({id:id(),name,known:i===1,x:i===1?1000:0,y:i===1?1000:0}));Object.assign(d,{points:q,directions:[{id:id(),from:q[0].id,to:q[1].id,az:dms(225)}],angles:[{id:id(),at:q[1].id,from:q[0].id,to:q[2].id,side:'cw',beta:dms(90)},{id:id(),at:q[2].id,from:q[1].id,to:q[3].id,side:'cw',beta:dms(120)}],distances:[{id:id(),from:q[1].id,to:q[2].id,s:100},{id:id(),from:q[2].id,to:q[3].id,s:120}]})}return p}
function save(){if(!project)return;let all=loadAll();project.modified=Date.now();let i=all.findIndex(p=>p.id===project.id);if(i<0)all.push(project);else all[i]=project;try{storeAll(all);dirty=false;let s=$('#status');if(s)s.textContent='Сохранено на телефоне ✓'}catch(e){alert('Не удалось сохранить: '+e.message)}}
function openProject(pid){let p=loadAll().find(x=>x.id===pid);if(p){project=p;result=null;dirty=false;render()}}
function editor(inner){app.innerHTML=`<div class="fade">${head(TYPES[section],'projects')}<div class="panel">${field('Название проекта','name',project.name,'text')}<div class="actions">${btn('Сохранить','save','alt')}<span id="status" class="muted">${dirty?'Есть несохранённые изменения':'Проект открыт'}</span></div></div>${inner}<div class="panel"><div class="actions">${btn('Рассчитать','calculate','big')}${btn('Сохранить проект','save','alt')}</div><div id="output"></div></div></div>`;if(result)showResult()}
function render(){if(!project)return;if(section==='level'){renderLevel();return}let d=project.data;if(section==='pgz')editor(`<div class="panel"><h3>Прямая геодезическая задача</h3><p class="muted">X₂=X₁+S·cos α; Y₂=Y₁+S·sin α</p><div class="row">${field('X₁, м','data.x',d.x)}${field('Y₁, м','data.y',d.y)}</div>${angle('Дирекционный угол α','data.az',d.az)}${field('Горизонтальное проложение S, м','data.s',d.s)}</div>`);if(section==='ogz')editor(`<div class="panel"><h3>Обратная геодезическая задача</h3><div class="row">${field('X₁, м','data.x1',d.x1)}${field('Y₁, м','data.y1',d.y1)}</div><div class="row">${field('X₂, м','data.x2',d.x2)}${field('Y₂, м','data.y2',d.y2)}</div></div>`);if(section==='traverse')renderTraverse();if(section==='arbitrary')renderArbitrary()}
function renderTraverse(){let d=project.data;let h=`<div class="panel"><h3>Настройки хода</h3><label><input type="checkbox" data-path="data.closed" ${d.closed?'checked':''}> Замкнутый ход</label>${sel('Измеренные горизонтальные углы','data.side',d.side,[['right','Правые по ходу'],['left','Левые по ходу']])}<div class="row">${field('Начальный X','data.x',d.x)}${field('Начальный Y','data.y',d.y)}</div>${angle('Начальный дирекционный угол','data.az',d.az)}`;if(!d.closed)h+=`<label><input type="checkbox" data-path="data.endKnown" ${d.endKnown?'checked':''}> Известны конечные координаты</label>${d.endKnown?`<div class="row">${field('Конечный X','data.endX',d.endX)}${field('Конечный Y','data.endY',d.endY)}</div>`:''}<br><label><input type="checkbox" data-path="data.endAzKnown" ${d.endAzKnown?'checked':''}> Известно конечное направление</label>${d.endAzKnown?angle('Конечный дирекционный угол','data.endAz',d.endAz):''}`;h+=`</div><div class="panel"><h3>Стороны и горизонтальные углы</h3><p class="muted">Для замкнутого хода β в строке i измерен в начальной точке соответствующей стороны. Для разомкнутого β начиная со второй строки измерен на повороте к этой стороне.</p>`;d.lines.forEach((l,i)=>h+=`<div class="item"><div class="itemhead"><strong>Сторона ${i+1}</strong>${btn('Удалить','removeLine','del',`data-index="${i}"`)}</div><div class="row">${field('Название',`data.lines.${i}.name`,l.name,'text')}${field('S, м',`data.lines.${i}.s`,l.s)}</div>${angle('Горизонтальный угол β',`data.lines.${i}.beta`,l.beta)}</div>`);h+=btn('＋ Добавить сторону','addLine','soft')+'</div>';editor(h)}
const opts=(pts,selected)=>pts.map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('');
const pointSel=(label,path,val,pts)=>`<div class="field"><label>${esc(label)}</label><select data-path="${path}">${opts(pts,val)}</select></div>`;
function renderArbitrary(){let d=project.data,q=d.points;let h=`<div class="panel"><h3>Конструктор произвольного хода</h3><div class="notice">Любые названия и расположение точек. Добавляй известные координаты, прямые или обратные направления, горизонтальные углы и расстояния. Угол измеряется в выбранной вершине от первого луча ко второму.</div></div><div class="panel"><h3>1. Точки</h3>`;q.forEach((p,i)=>{h+=`<div class="item"><div class="itemhead"><strong>Точка ${i+1}</strong>${btn('Удалить','removePoint','del',`data-id="${p.id}"`)}</div>${field('Название',`data.points.${i}.name`,p.name,'text')}<div class="row"><label><input type="checkbox" data-path="data.points.${i}.known" ${p.known?'checked':''}> Координаты известны</label></div>${p.known?`<div class="row">${field('X, м',`data.points.${i}.x`,p.x)}${field('Y, м',`data.points.${i}.y`,p.y)}</div>`:''}</div>`});h+=btn('＋ Добавить точку','addPoint','soft')+'</div><div class="panel"><h3>2. Дирекционные углы</h3><p class="muted">Если дан обратный угол, выбирай направление в обратном порядке.</p>';d.directions.forEach((v,i)=>h+=`<div class="item"><div class="itemhead"><strong>Направление ${i+1}</strong>${btn('Удалить','removeDirection','del',`data-id="${v.id}"`)}</div><div class="row">${pointSel('От точки',`data.directions.${i}.from`,v.from,q)}${pointSel('К точке',`data.directions.${i}.to`,v.to,q)}</div>${angle('Дирекционный угол',`data.directions.${i}.az`,v.az)}</div>`);h+=btn('＋ Добавить направление','addDirection','soft')+'</div><div class="panel"><h3>3. Горизонтальные углы</h3>';d.angles.forEach((v,i)=>h+=`<div class="item"><div class="itemhead"><strong>β${i+1}</strong>${btn('Удалить','removeAngle','del',`data-id="${v.id}"`)}</div>${pointSel('Вершина',`data.angles.${i}.at`,v.at,q)}<div class="row">${pointSel('Первый луч — на точку',`data.angles.${i}.from`,v.from,q)}${pointSel('Второй луч — на точку',`data.angles.${i}.to`,v.to,q)}</div>${sel('Отсчёт',`data.angles.${i}.side`,v.side,[['cw','По часовой стрелке'],['ccw','Против часовой стрелки']])}${angle('Горизонтальный угол',`data.angles.${i}.beta`,v.beta)}</div>`);h+=btn('＋ Добавить угол','addAngle','soft')+'</div><div class="panel"><h3>4. Расстояния</h3>';d.distances.forEach((v,i)=>h+=`<div class="item"><div class="itemhead"><strong>Расстояние ${i+1}</strong>${btn('Удалить','removeDistance','del',`data-id="${v.id}"`)}</div><div class="row">${pointSel('От точки',`data.distances.${i}.from`,v.from,q)}${pointSel('К точке',`data.distances.${i}.to`,v.to,q)}</div>${field('Горизонтальное проложение S, м',`data.distances.${i}.s`,v.s)}</div>`);h+=btn('＋ Добавить расстояние','addDistance','soft')+'</div>';editor(h)}
function check(vals,msg){if(vals.some(v=>!Number.isFinite(v)))throw Error(msg)}
function calcPGZ(){let d=project.data,x=n(d.x),y=n(d.y),a=deg(d.az),s=n(d.s);check([x,y,a,s],'Проверь исходные данные');if(s<0)throw Error('Расстояние не может быть отрицательным');let dx=s*Math.cos(a*R),dy=s*Math.sin(a*R);return {text:`ИСХОДНЫЕ ДАННЫЕ\nX₁ = ${f(x)} м; Y₁ = ${f(y)} м\nα = ${ds(a)}; S = ${f(s)} м\n\nПОДРОБНОЕ РЕШЕНИЕ\n1. Переводим угол: α = ${f(a,8)}°\n2. ΔX = S · cos α = ${f(s)} · cos(${ds(a)}) = ${f(dx)} м\n3. ΔY = S · sin α = ${f(s)} · sin(${ds(a)}) = ${f(dy)} м\n4. X₂ = X₁ + ΔX = ${f(x)} + (${f(dx)}) = ${f(x+dx)} м\n5. Y₂ = Y₁ + ΔY = ${f(y)} + (${f(dy)}) = ${f(y+dy)} м`,points:[{id:'a',name:'1',x,y},{id:'b',name:'2',x:x+dx,y:y+dy}],edges:[['a','b',s,a]],angles:[{at:'a',from:'north',to:'b',v:a,label:'α'}]}}
function calcOGZ(){let d=project.data,x=n(d.x1),y=n(d.y1),X=n(d.x2),Y=n(d.y2);check([x,y,X,Y],'Проверь координаты');let dx=X-x,dy=Y-y,s=Math.hypot(dx,dy),a=norm(Math.atan2(dy,dx)/R);return {text:`ИСХОДНЫЕ ДАННЫЕ\nX₁ = ${f(x)}; Y₁ = ${f(y)}\nX₂ = ${f(X)}; Y₂ = ${f(Y)}\n\nПОДРОБНОЕ РЕШЕНИЕ\n1. ΔX = X₂ − X₁ = ${f(X)} − ${f(x)} = ${f(dx)} м\n2. ΔY = Y₂ − Y₁ = ${f(Y)} − ${f(y)} = ${f(dy)} м\n3. S = √(ΔX² + ΔY²) = √(${f(dx)}² + ${f(dy)}²) = ${f(s)} м\n4. α = atan2(ΔY, ΔX) = ${s?ds(a):'не определён: точки совпадают'}\n5. Обратный угол = α ± 180° = ${s?ds(norm(a+180)):'—'}`,points:[{id:'a',name:'1',x,y},{id:'b',name:'2',x:X,y:Y}],edges:[['a','b',s,a]],angles:s?[{at:'a',from:'north',to:'b',v:a,label:'α'}]:[]}}

function calcArbitrary(){let d=project.data,q=d.points;if(q.length<2)throw Error('Добавь минимум две точки');let names=new Map(q.map(p=>[p.id,p.name||'?'])),coords=new Map(),az=new Map(),lengths=new Map(),warnings=new Set(),steps=[];const name=i=>names.get(i)||'?',key=(a,b)=>a+'|'+b,lenkey=(a,b)=>[a,b].sort().join('|');function putA(a,b,v,source){if(!names.has(a)||!names.has(b)||a===b||!Number.isFinite(v))return false;let k=key(a,b),old=az.get(k);if(old!==undefined){if(Math.abs(diff(old-v))>1/3600)warnings.add(`Несовпадение направления ${name(a)} → ${name(b)}: ${f(diff(old-v)*3600,2)}″`);return false}az.set(k,norm(v));steps.push(`${source}: α${name(a)}→${name(b)} = ${ds(norm(v))}`);return true}function putC(i,x,y,source){let old=coords.get(i);if(old){if(Math.hypot(old.x-x,old.y-y)>.02)warnings.add(`Расхождение координат ${name(i)} (${source}): ${f(Math.hypot(old.x-x,old.y-y))} м`);return false}if(!Number.isFinite(x)||!Number.isFinite(y))return false;coords.set(i,{x,y});steps.push(`${source}: ${name(i)}: X=${f(x)}, Y=${f(y)}`);return true}function putS(a,b,s,source){if(!Number.isFinite(s)||s<=0)return false;let k=lenkey(a,b),old=lengths.get(k);if(old!==undefined){if(Math.abs(old-s)>.02)warnings.add(`Расхождение длины ${name(a)}–${name(b)} (${source}): ${f(old-s)} м`);return false}lengths.set(k,s);return true}q.forEach(p=>{if(p.known){let x=n(p.x),y=n(p.y);check([x,y],'Неверные координаты '+name(p.id));putC(p.id,x,y,'Исходные координаты')}});d.directions.forEach(v=>{if(v.from===v.to)warnings.add('Направление не может соединять точку саму с собой');else putA(v.from,v.to,deg(v.az),'Исходный угол')});d.distances.forEach(v=>{if(!putS(v.from,v.to,n(v.s),'Измеренное расстояние'))warnings.add('Проверь расстояние между точками')});for(let iteration=0;iteration<q.length*8+8;iteration++){let changed=false;for(let [k,a] of [...az]){let [u,v]=k.split('|');if(putA(v,u,a+180,'Обратный угол = прямой ± 180°'))changed=true}for(let v of d.angles){if(new Set([v.at,v.from,v.to]).size!==3 let autoTimer=null;
function saveHistory(reason){
 if(!project)return;
 if(!Array.isArray(project.history))project.history=[];
 const snapshot=JSON.stringify(project.data),last=project.history[project.history.length-1];
 if(last?.snapshot===snapshot)return;
 project.history.push({at:Date.now(),reason,snapshot});
 if(project.history.length>20)project.history.splice(0,project.history.length-20);
}

function calcLevel(){
 const d=project.data,L=d.stations||[];
 if(!L.length)throw Error('Добавь хотя бы одну станцию');
 const H=n(d.startH),a=L.map(v=>n(v.back)),b=L.map(v=>n(v.front)),dist=L.map(v=>n(v.distance));
 check([H,...a,...b,...dist],'Проверь отсчёты и расстояния');
 if([...a,...b].some(v=>v<0)||dist.some(v=>v<=0))throw Error('Отсчёты не могут быть отрицательными, расстояния должны быть больше нуля');
 const h=a.map((v,i)=>v-b[i]),sumA=a.reduce((x,y)=>x+y,0),sumB=b.reduce((x,y)=>x+y,0),sumH=h.reduce((x,y)=>x+y,0),total=dist.reduce((x,y)=>x+y,0);
 let fh=0,cor=h.map(()=>0),end=null,tol=null;
 const warnings=[];
 let text=`ИСХОДНЫЕ ДАННЫЕ\nНачальная отметка ${d.startName||'Рп 1'}: H₀ = ${f(H,4)} м\nСтанций: ${L.length}\n\nПОСТАНЦИОННОЕ РЕШЕНИЕ\n`;
 if(d.endKnown){end=n(d.endH);tol=n(d.tolerance);check([end,tol],'Проверь конечную отметку и допуск');if(tol<0)throw Error('Допуск не может быть отрицательным');fh=sumH-(end-H);cor=dist.map(s=>-fh*s/total);}
 let rawH=H,adjustedH=H,rows=[{id:'p0',name:d.startName||'Рп 1',h:H,raw:H}];
 for(let i=0;i<L.length;i++){
  rawH+=h[i];adjustedH+=h[i]+cor[i];
  const name=i===L.length-1?(d.endName||`Точка ${i+1}`):`Точка ${i+1}`;
  text+=`\n${i+1}. ${L[i].name||'Станция '+(i+1)}: a = ${f(a[i],4)} м; b = ${f(b[i],4)} м\nh${i+1} = a − b = ${f(a[i],4)} − ${f(b[i],4)} = ${f(h[i],4)} м\n`;
  if(d.endKnown)text+=`v${i+1} = −fₕ · Lᵢ / ΣL = ${f(cor[i],4)} м\nh${i+1} испр = h${i+1} + v${i+1} = ${f(h[i]+cor[i],4)} м\n`;
  text+=`H(${name}) = ${f(adjustedH-(h[i]+cor[i]),4)} + ${f(h[i]+cor[i],4)} = ${f(adjustedH,4)} м\n`;
  rows.push({id:'p'+(i+1),name,h:adjustedH,raw:rawH,back:a[i],front:b[i],dist:dist[i],delta:h[i],cor:cor[i],station:L[i].name||'Ст. '+(i+1)});
 }
 text+=`\nКОНТРОЛЬ\nΣa = ${f(sumA,4)} м; Σb = ${f(sumB,4)} м\nΣh = Σa − Σb = ${f(sumH,4)} м\nΣL = ${f(total,2)} м\n`;
 if(d.endKnown){
  text+=`ΔH известное = Hкон − Hнач = ${f(end-H,4)} м\nfₕ = Σh − ΔH = ${f(fh,4)} м = ${f(fh*1000,1)} мм\nДопуск: ±${f(tol,1)} мм → ${Math.abs(fh*1000)<=tol?'В ПРЕДЕЛАХ ДОПУСКА':'ПРЕВЫШЕН'}\nΣv = ${f(cor.reduce((x,y)=>x+y,0),4)} м\nHкон исправленная = ${f(adjustedH,4)} м (заданная: ${f(end,4)} м)\n`;
  if(Math.abs(fh*1000)>tol)warnings.push('Невязка '+f(fh*1000,1)+' мм превышает установленный допуск ±'+f(tol,1)+' мм. Поправки показаны для анализа, исходные измерения необходимо проверить.');
 }else text+=`Конечная отметка не задана: контроль по замыканию и распределение поправок недоступны.\n`;
 text+=`\nПримечание: поправки распределены пропорционально введённым длинам участков. Для официальных работ используй допуски и методику своего класса нивелирования.`;
 return {text,level:rows,warnings};
}
function levelDiagram(r){

 if(!N)return '';

 const pts=rows.map((v,i)=>`${px(i)},${py(v.h)}`).join(' ');
 svg+=`<polyline points="${pts}" fill="none" stroke="#6b9d87" stroke-width="4"/>`;

  const v=rows[i],x=px(i),y=py(v.h);
  svg+=`<g data-info="${esc(v.name+': H='+f(v.h,4)+' м'+(i?' | h='+f(v.delta,4)+' м; v='+f(v.cor,4)+' м':''))}"><line x1="${x}" y1="${y}" x2="${x}" y2="${base}" stroke="#b3a6cb" stroke-dasharray="5 5"/><circle cx="${x}" cy="${y}" r="9" fill="#d986ad" stroke="white" stroke-width="3"/><text x="${x}" y="${y-23}" text-anchor="middle" font-size="20" fill="#574669" font-weight="bold">${esc(v.name)}</text><text x="${x}" y="${base+28}" text-anchor="middle" font-size="17" fill="#574669">H=${f(v.h,3)}</text></g>`;
  if(i){const x0=px(i-1),mid=(x0+x)/2,top=Math.min(py(rows[i-1].h),y)-92;
   svg+=`<g data-info="${esc(v.station+': a='+f(v.back,3)+' м; b='+f(v.front,3)+' м; h='+f(v.delta,3)+' м')}"><path d="M${mid} ${top+30}L${mid-15} ${top+68}M${mid} ${top+30}L${mid+15} ${top+68}M${mid} ${top+30}V${top+62}" stroke="#8c73b6" stroke-width="3" fill="none"/><rect x="${mid-17}" y="${top+17}" width="34" height="19" rx="6" fill="#b28acb"/><path d="M${mid-16} ${top+25}L${x0} ${py(rows[i-1].h)}M${mid+16} ${top+25}L${x} ${y}" stroke="#d588ad" stroke-dasharray="5 4" stroke-width="2"/><text x="${mid}" y="${top+5}" text-anchor="middle" font-size="18" fill="#70559a">${esc(v.station)}</text><text x="${mid}" y="${top+93}" text-anchor="middle" font-size="17" fill="#bc668f">a=${f(v.back,3)} / b=${f(v.front,3)}</text><text x="${mid}" y="${base+55}" text-anchor="middle" font-size="17" fill="#8065a5">h=${f(v.delta,3)} м</text></g>`;
  }
 }

}

render=function(){if(!['total','stake','journal','slope','exchange'].includes(section))return oldRender();let d=project.data,h='';if(section==='total')h=`<div class="panel"><h3>Измерение тахеометром</h3>${intro}<div class="row">${field('Станция','data.station',d.station,'text')}${field('Имя точки','data.point',d.point,'text')}</div><div class="row">${field('X станции','data.x',d.x)}${field('Y станции','data.y',d.y)}${field('H станции','data.h',d.h)}</div><div class="row">${field('Ориентирование α, °','data.az',d.az)}${field('Горизонтальный отсчёт Hz, °','data.horizontal',d.horizontal)}</div>${sel('Вертикальный отсчёт','data.mode',d.mode,[['zenith','Зенитное расстояние Z (0° вверх)'],['incline','Угол наклона v (0° горизонт)']])}<div class="row">${field('Z или v, °','data.vertical',d.vertical)}${field('Наклонное расстояние D, м','data.slope',d.slope)}</div><div class="row">${field('Высота прибора i, м','data.hi',d.hi)}${field('Высота отражателя r, м','data.hr',d.hr)}</div></div>`;
if(section==='stake')h=`<div class="panel"><h3>Разбивка и вынос точки</h3>${intro}<div class="row">${field('X станции','data.sx',d.sx)}${field('Y станции','data.sy',d.sy)}</div><div class="row">${field('X ориентира','data.rx',d.rx)}${field('Y ориентира','data.ry',d.ry)}</div><div class="row">${field('X проекта','data.px',d.px)}${field('Y проекта','data.py',d.py)}</div><label><input type="checkbox" data-path="data.hasFact" ${d.hasFact?'checked':''}> Есть измеренная фактическая точка</label>${d.hasFact?`<div class="row">${field('X факт','data.fx',d.fx)}${field('Y факт','data.fy',d.fy)}</div>`:''}</div>`;
if(section==='journal'){h=`<div class="panel"><h3>Электронный полевой журнал</h3>${intro}<div class="row">${field('X станции','data.sx',d.sx)}${field('Y станции','data.sy',d.sy)}${field('H станции','data.sh',d.sh)}</div><div class="row">${field('Высота прибора i, м','data.hi',d.hi)}${field('Ориентирование α, °','data.az',d.az)}</div>${sel('Вертикальный отсчёт','data.mode',d.mode,[['zenith','Зенитное расстояние Z'],['incline','Угол наклона v']])}</div><div class="panel"><h3>Измеренные точки</h3>`;d.rows.forEach((r,i)=>h+=`<div class="item"><div class="itemhead"><strong>Измерение ${i+1}</strong>${btn('Удалить','removeObservation','del',`data-index="${i}"`)}</div><div class="row">${field('Имя точки',`data.rows.${i}.name`,r.name,'text')}${field('Hz, °',`data.rows.${i}.hz`,r.hz)}</div><div class="row">${field('Z или v, °',`data.rows.${i}.z`,r.z)}${field('Наклонное D, м',`data.rows.${i}.s`,r.s)}${field('Высота отражателя r, м',`data.rows.${i}.hr`,r.hr)}</div></div>`);h+=btn('＋ Добавить измерение','addObservation','soft')+'</div>'}
if(section==='slope')h=`<div class="panel"><h3>Уклоны и проектные отметки</h3><div class="row">${field('H начальная, м','data.startH',d.startH)}${field('H конечная, м','data.endH',d.endH)}${field('Горизонтальное S, м','data.distance',d.distance)}</div><h4>Проектная отметка</h4><div class="row">${field('H проекта в начале, м','data.designH',d.designH)}${field('Проектный уклон, % (со знаком)','data.designSlope',d.designSlope)}${field('Расстояние от начала, м','data.offset',d.offset)}</div>${field('Фактическая отметка в расчётной точке, м','data.actualH',d.actualH)}</div>`;
if(section==='exchange')h=`<div class="panel"><h3>Импорт CSV и экспорт DXF / CSV</h3><p class="notice">CSV: первая строка name,x,y,h; разделитель запятая, точка с запятой или табуляция. Десятичная точка. DXF — текстовый ASCII R12: POINT, TEXT и LINE между соседними точками, без системы координат и геодезической трансформации.</p><label>Вставь CSV или загрузи файл</label><textarea id="csvbox" data-path="data.csv" rows="9" style="width:100%;border:1px solid #d7c4e3;border-radius:10px;padding:10px">${esc(d.csv)}</textarea><div class="actions">${btn('Разобрать CSV','parseCsv','alt')}${btn('Загрузить CSV','importCsv','soft')}${btn('Скачать CSV','downloadCsv','alt')}${btn('Скачать DXF','downloadDxf','alt')}</div><p class="muted">Разбор CSV проверяет координаты и имена. Экспортирует только успешно разобранные точки.</p>${d.points?.length?`<p class="success">Точек загружено: ${d.points.length}</p><div class="result">${esc(d.points.map(p=>`${p.name}: X=${f(p.x)}, Y=${f(p.y)}, H=${p.h==null?'—':f(p.h)}`).join('\n'))}</div>`:''}</div>`;
editor(h)};
function readNumber(d,k){let v=n(d[k]);if(!Number.isFinite(v))throw Error('Проверь поле: '+k);return v}
function polar(stx,sty,az,s){return {x:stx+s*Math.cos(az*R),y:sty+s*Math.sin(az*R)}}
function tach(D,vertical,mode,hi,hr){if(D<=0)throw Error('Наклонное расстояние должно быть положительным');if(mode==='zenith'&&(vertical<0||vertical>180))throw Error('Z должно быть в пределах 0–180°');if(mode==='incline'&&(vertical< -90||vertical>90))throw Error('v должно быть в пределах −90…90°');let v=mode==='zenith'?90-vertical:vertical;return {v,horiz:D*Math.cos(v*R),dh:D*Math.sin(v*R)+hi-hr}}
function calcTotal(){let d=project.data,x=readNumber(d,'x'),y=readNumber(d,'y'),h=readNumber(d,'h'),az=readNumber(d,'az'),hz=readNumber(d,'horizontal'),D=readNumber(d,'slope'),v=readNumber(d,'vertical'),hi=readNumber(d,'hi'),hr=readNumber(d,'hr');let z=tach(D,v,d.mode,hi,hr),a=norm(az+hz),p=polar(x,y,a,z.horiz);return {text:`ИЗМЕРЕНИЕ ${d.station} → ${d.point}\n1. Вертикальный угол v = ${d.mode==='zenith'?'90° − Z = ':''}${f(z.v,6)}°\n2. Горизонтальное проложение S = D · cos v = ${f(D)} · cos(${f(z.v,6)}°) = ${f(z.horiz)} м\n3. Превышение ΔH = D · sin v + i − r = ${f(D)} · sin(${f(z.v,6)}°) + ${f(hi)} − ${f(hr)} = ${f(z.dh)} м\n4. Дирекционный угол α = αориент + Hz = ${f(az,6)}° + ${f(hz,6)}° = ${ds(a)}\n5. ΔX = S · cos α = ${f(p.x-x)} м; ΔY = S · sin α = ${f(p.y-y)} м\n6. Xточки = ${f(x)} + ${f(p.x-x)} = ${f(p.x)} м\n7. Yточки = ${f(y)} + ${f(p.y-y)} = ${f(p.y)} м\n8. Hточки = ${f(h)} + ${f(z.dh)} = ${f(h+z.dh)} м\n\nКОНТРОЛЬ: S = ${f(z.horiz)} м; |ΔH−i+r| = ${f(Math.abs(D*Math.sin(z.v*R)))} м. Проверь тип вертикального угла и поправки прибора.`,points:[{id:'s',name:d.station||'СТ',x,y},{id:'p',name:d.point||'П',x:p.x,y:p.y}],edges:[['s','p',z.horiz,a]],angles:[{at:'s',from:'north',to:'p',v:a,label:'α'}]}}
function calcStake(){let d=project.data,sx=readNumber(d,'sx'),sy=readNumber(d,'sy'),rx=readNumber(d,'rx'),ry=readNumber(d,'ry'),px=readNumber(d,'px'),py=readNumber(d,'py');let orient=Math.hypot(rx-sx,ry-sy),s=Math.hypot(px-sx,py-sy);if(orient<1e-8||s<1e-8)throw Error('Ориентир и проект должны отличаться от станции');let a0=norm(Math.atan2(ry-sy,rx-sx)/R),a=norm(Math.atan2(py-sy,px-sx)/R),turn=norm(a-a0);let pts=[{id:'s',name:'Станция',x:sx,y:sy},{id:'r',name:'Ориентир',x:rx,y:ry},{id:'p',name:'Проект',x:px,y:py}],edges=[['s','r',orient,a0],['s','p',s,a]],text=`РАЗБИВКА ТОЧКИ\n1. ΔXориент = ${f(rx-sx)}; ΔYориент = ${f(ry-sy)}\n2. αориент = atan2(ΔY,ΔX) = ${ds(a0)}\n3. ΔXпроект = ${f(px-sx)}; ΔYпроект = ${f(py-sy)}\n4. αпроект = atan2(ΔY,ΔX) = ${ds(a)}\n5. Горизонтальное расстояние S = √(ΔX²+ΔY²) = ${f(s)} м\n6. Поворот по часовой стрелке от ориентира = αпроект − αориент (mod 360°) = ${ds(turn)}`;if(d.hasFact){let fx=readNumber(d,'fx'),fy=readNumber(d,'fy'),dx=fx-px,dy=fy-py,forward=dx*Math.cos(a*R)+dy*Math.sin(a*R),right=-dx*Math.sin(a*R)+dy*Math.cos(a*R);pts.push({id:'f',name:'Факт',x:fx,y:fy});edges.push(['p','f',Math.hypot(dx,dy),null]);text+=`\n\nИСПОЛНИТЕЛЬНЫЙ КОНТРОЛЬ (ФАКТ − ПРОЕКТ)\nΔX = ${f(dx)} м; ΔY = ${f(dy)} м\nПлановое отклонение = √(ΔX²+ΔY²) = ${f(Math.hypot(dx,dy))} м\nПродольное отклонение (вперёд +) = ΔX cos α + ΔY sin α = ${f(forward)} м\nПоперечное отклонение (вправо +) = −ΔX sin α + ΔY cos α = ${f(right)} м\nДля выхода из факта в проект: вперёд ${f(-forward)} м; вправо ${f(-right)} м.`}return {text,points:pts,edges,angles:[{at:'s',from:'r',to:'p',v:turn,label:'β'}]}}
function calcJournal(){let d=project.data,sx=readNumber(d,'sx'),sy=readNumber(d,'sy'),sh=readNumber(d,'sh'),hi=readNumber(d,'hi'),base=readNumber(d,'az');if(!d.rows.length)throw Error('Добавь измерение');let pts=[{id:'s',name:'Станция',x:sx,y:sy}],edges=[],angles=[],out=['ПОЛЕВОЙ ЖУРНАЛ','Станция: X='+f(sx)+'; Y='+f(sy)+'; H='+f(sh)+'; i='+f(hi),''];d.rows.forEach((r,i)=>{let hz=n(r.hz),z=n(r.z),D=n(r.s),hr=n(r.hr);check([hz,z,D,hr],'Строка '+(i+1)+': неполные измерения');let t=tach(D,z,d.mode,hi,hr),a=norm(base+hz),p=polar(sx,sy,a,t.horiz),pid='p'+i;pts.push({id:pid,name:r.name||'Т'+(i+1),...p});edges.push(['s',pid,t.horiz,a]);angles.push({at:'s',from:'north',to:pid,v:a,label:'α'+(i+1)});out.push(`${i+1}. ${r.name||'Т'+(i+1)}: Hz=${f(hz,5)}°; ${d.mode==='zenith'?'Z':'v'}=${f(z,5)}°; D=${f(D)} м; r=${f(hr)} м`,`v=${f(t.v,5)}°; S=D·cos v=${f(t.horiz)} м`,`ΔH=D·sin v+i−r=${f(t.dh)} м; H=${f(sh+t.dh)} м`,`α=αориент+Hz=${ds(a)}`,`ΔX=S·cos α=${f(p.x-sx)}; ΔY=S·sin α=${f(p.y-sy)}`,`X=${f(p.x)}; Y=${f(p.y)}`,'')});out.push('КОНТРОЛЬ: проверь ориентирование, тип вертикального угла, высоты прибора и отражателя. Автоматического уравнивания наблюдений нет.');return {text:out.join('\n'),points:pts,edges,angles}}
function calcSlope(){let d=project.data,h0=readNumber(d,'startH'),h1=readNumber(d,'endH'),s=readNumber(d,'distance'),design=readNumber(d,'designH'),i=readNumber(d,'designSlope'),offset=readNumber(d,'offset'),actual=readNumber(d,'actualH');if(s<=0||offset<0)throw Error('Расстояние должно быть положительным, смещение — неотрицательным');let dh=h1-h0,k=dh/s,hd=design+i*offset/100,work=actual-hd;return {text:`УКЛОНЫ И ПРОЕКТНЫЕ ОТМЕТКИ\n1. Превышение ΔH = Hкон − Hнач = ${f(h1)} − ${f(h0)} = ${f(dh)} м\n2. Уклон i = ΔH / S = ${f(dh)} / ${f(s)} = ${f(k,7)}\n3. В процентах: i·100 = ${f(k*100,4)} %\n4. В промилле: i·1000 = ${f(k*1000,3)} ‰\n5. Угол наклона = atan(i) = ${f(Math.atan(k)/R,6)}°\n\nПРОЕКТ\n6. Hпроект(x) = Hпроект(0) + iпроект·x/100\n= ${f(design)} + ${f(i,4)}·${f(offset)}/100 = ${f(hd)} м\n7. Рабочая отметка (факт − проект) = ${f(actual)} − ${f(hd)} = ${f(work)} м\n${work>0?'Положительное значение: фактическая поверхность выше проектной.':work<0?'Отрицательное значение: фактическая поверхность ниже проектной.':'Фактическая отметка совпадает с проектной.'}\n\nКОНТРОЛЬ: горизонтальное расстояние, отметки и уклон должны быть в одной системе единиц.`,points:[{id:'a',name:'Начало',x:0,y:h0},{id:'b',name:'Конец',x:s,y:h1}],edges:[['a','b',Math.hypot(s,dh),null]],angles:[]}}
function parseCsv(raw){let lines=raw.replace(/^\uFEFF/,'').trim().split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw Error('CSV: нужна строка заголовка и минимум одна точка');let sep=lines[0].includes(';')?';':lines[0].includes('\t')?'\t':',';let split=l=>l.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));let hdr=split(lines[0]).map(x=>x.toLowerCase()),ix=['name','x','y'].map(k=>hdr.indexOf(k)),ih=hdr.indexOf('h');if(ix.some(i=>i<0))throw Error('Заголовок должен содержать name,x,y (h необязательно)');let points=lines.slice(1).map((l,i)=>{let a=split(l),name=a[ix[0]],x=Number(a[ix[1]]),y=Number(a[ix[2]]),h=ih>=0&&a[ih]!==''?Number(a[ih]):null;if(!name||!Number.isFinite(x)||!Number.isFinite(y)||(h!==null&&!Number.isFinite(h)))throw Error('CSV: некорректная строка '+(i+2));return {name,x,y,h}});if(points.length>5000)throw Error('Не более 5000 точек');if(new Set(points.map(p=>p.name)).size!==points.length)throw Error('Повторяются имена точек');return points}
function csvText(pts){return 'name,x,y,h\n'+pts.map(p=>[p.name,p.x,p.y,p.h??''].join(',')).join('\n')+'\n'}
function dxfText(pts){let lines=['0','SECTION','2','HEADER','9','$ACADVER','1','AC1009','0','ENDSEC','0','SECTION','2','ENTITIES'];let add=(type,vals)=>{lines.push('0',type,...Object.entries(vals).flatMap(([k,v])=>[k,String(v)]))};pts.forEach((p,i)=>{add('POINT',{8:'POINTS',10:p.y,20:p.x,30:p.h??0});add('TEXT',{8:'LABELS',10:p.y+0.5,20:p.x+0.5,30:p.h??0,40:1,1:p.name.replace(/[\r\n]/g,' ').slice(0,100)});if(i){let prev=pts[i-1];add('LINE',{8:'LINES',10:prev.y,20:prev.x,30:prev.h??0,11:p.y,21:p.x,31:p.h??0})}});lines.push('0','ENDSEC','0','EOF');return lines.join('\n')+'\n'}
function downloadText(name,mime,content){if(window.AndroidStorage?.exportFile){window.AndroidStorage.exportFile(name,mime,content);return}let blob=new Blob([content],{type:mime+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function calcExchange(){let pts=parseCsv(project.data.csv);project.data.points=pts;return {text:`ИМПОРТ CSV\nПрочитано точек: ${pts.length}\n\n`+pts.map(p=>`${p.name}: X=${f(p.x)}; Y=${f(p.y)}; H=${p.h===null?'не задана':f(p.h)}`).join('\n')+'\n\nКОНТРОЛЬ: имена уникальны, координаты числовые. DXF: CAD X=геодезическое Y (восток), CAD Y=геодезическое X (север). Линии между точками строятся в порядке строк CSV, не являются измеренными сторонами.',points:pts.map((p,i)=>({id:String(i),name:p.name,x:p.x,y:p.y})),edges:pts.slice(1).map((p,i)=>[String(i),String(i+1),Math.hypot(p.x-pts[i].x,p.y-pts[i].y),null]),angles:[]}}
calculate=function(){if(!['total','stake','journal','slope','exchange'].includes(section))return oldCalculate();try{result=section==='total'?calcTotal():section==='stake'?calcStake():section==='journal'?calcJournal():section==='slope'?calcSlope():calcExchange();showResult();saveHistory('Расчёт');save();$('#output')?.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){let out=$('#output');if(out)out.innerHTML=`<div class="error">${esc(e.message)}</div>`}};
const oldChangeRender=render;
document.addEventListener('click',e=>{let t=e.target.closest('[data-action]');if(!t||!['addObservation','removeObservation','parseCsv','downloadCsv','downloadDxf','importCsv'].includes(t.dataset.action))return;e.stopImmediatePropagation();if(!project)return;let a=t.dataset.action,d=project.data;if(a==='addObservation'){d.rows.push({name:'Т'+(d.rows.length+1),hz:0,z:90,s:50,hr:1.8});dirty=true;result=null;render()}if(a==='removeObservation'){d.rows.splice(Number(t.dataset.index),1);dirty=true;result=null;render()}if(a==='parseCsv'){try{d.points=parseCsv(d.csv);dirty=true;saveHistory('Импорт CSV');save();render()}catch(err){alert(err.message)}}if(a==='downloadCsv'||a==='downloadDxf'){try{let pts=parseCsv(d.csv);d.points=pts;downloadText(a==='downloadCsv'?'RASSCHET_points.csv':'RASSCHET_points.dxf',a==='downloadCsv'?'text/csv':'application/dxf',a==='downloadCsv'?csvText(pts):dxfText(pts));save()}catch(err){alert(err.message)}}if(a==='importCsv'){if(window.AndroidStorage?.importCsv){window.AndroidStorage.importCsv()}else{let inp=document.createElement('input');inp.type='file';inp.accept='.csv,text/csv,text/plain';inp.onchange=async()=>{if(inp.files?.[0])receiveCsv(await inp.files[0].text())};inp.click()}}},true);

body{color:var(--ink);background:radial-gradient(ellipse at 7% 5%,#dcdcf1 0%,transparent 40%),radial-gradient(ellipse at 95% 30%,#d6e9df 0%,transparent 44%),linear-gradient(160deg,#eaf0f5,#edf0f5 45%,#dce8e6);background-attachment:fixed}
.hero{padding:38px 0 26px;color:var(--ink)}.hero .logo{font-family:system-ui,Arial,sans-serif;font-weight:750;letter-spacing:-2px;text-shadow:none;color:#394d75;font-size:clamp(49px,12vw,78px)}.hero .tag{font:600 18px system-ui,sans-serif;letter-spacing:2.4px;color:#54708a;margin:6px 0 16px}.hero .flower{display:none}.hero .hero-caption{font-size:12px;letter-spacing:1.3px;color:#667f90;margin-bottom:24px}
.tile{min-height:162px;border-radius:18px;box-shadow:0 10px 22px #2b49641c;transition:transform .2s,box-shadow .2s}.tile:active{transform:scale(.98)}.tile h2{font-family:system-ui,Arial,sans-serif;font-weight:720;font-size:clamp(13px,3.6vw,19px);letter-spacing:.35px}.tile svg{opacity:.95}.blue{background:linear-gradient(145deg,#4f81ac,#305a82)}.pink{background:linear-gradient(145deg,#7770a8,#504d83)}.teal{background:linear-gradient(145deg,#609d99,#387c83)}.rose{background:linear-gradient(145deg,#94b59b,#648e7c)}.violet{background:linear-gradient(145deg,#7873a9,#565388)}
.panel{background:#fffffff2;border:1px solid #e4ebee;box-shadow:0 8px 24px #29435a12;border-radius:18px}.panel h3{font-family:system-ui,Arial,sans-serif;font-weight:750;color:#4d5888;font-size:21px}.panel h4{color:#4c718a}.top{color:#354d68}.top h1{font-family:system-ui,Arial,sans-serif;font-weight:730}.back{background:#fff;color:#4c6286;border:1px solid #dce5ea}.btn{background:#585f99}.btn.alt{background:#427c91}.btn.del{background:#a85c75}.btn.soft{background:#e7eaf4;color:#4d5888}.field label,label{color:#526779}input,select,textarea{border-color:#d3dfe5!important;color:#243d50}input:focus,select:focus,textarea:focus{outline:2px solid #95a8cb;outline-offset:1px}.muted{color:#61758a}.notice{background:#edf2f5;color:#435c70}.item,.project{border-color:#dce6e8}.itemhead strong{color:#4c658b}.drawing-wrap{border-color:#dce5ea!important}.diagram{border-color:#dce5ea}.version-badge{background:#e8eeef!important;color:#4e6481!important;box-shadow:0 2px 8px #29435a19!important}
.help-entry{margin:18px 0 0;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:17px;border:1px solid #b9cbd5;background:#f9fcfcee;color:#385b76;font-weight:750;font-size:16px;box-shadow:0 7px 18px #29435a12}.help-entry span{font-size:12px;font-weight:500;color:#667d8d}.help-section{margin:12px 0;padding:16px;border-radius:15px;border:1px solid #dce6ea;background:#f9fbfc}.help-section h4{margin:0 0 7px;color:#4e5a8b;font-size:17px}.help-section p{margin:7px 0;line-height:1.55}.help-section small{color:#667c8b}.help-top{display:flex;gap:8px;align-items:center;margin-bottom:15px}.help-top h1{margin:0;font-size:25px;color:#354d68}.help-mini{border:1px solid #dce5ea;background:#fff;color:#4d6289;border-radius:10px;padding:9px 12px;font-weight:700;margin-left:auto}
@media(max-width:600px){.tile{min-height:145px}.hero{padding-top:32px}.hero .logo{font-size:clamp(35px,9vw,54px);letter-spacing:-1.8px;white-space:nowrap}.tile svg{width:80px;height:55px}}
</style>
<script>
// Rasschet 0.1: спокойная тема и встроенный справочник по всем разделам.
(function(){
 const guide=[
 ['pgz','ПГЗ — прямая геодезическая задача','Определяет координаты новой точки по координатам исходной, дирекционному углу и горизонтальному расстоянию.','X и Y начальной точки, дирекционный угол в градусах, минутах и секундах, горизонтальное расстояние S.','ΔX = S·cos α; ΔY = S·sin α; X₂ = X₁ + ΔX; Y₂ = Y₁ + ΔY.'],
 ['ogz','ОГЗ — обратная геодезическая задача','Определяет расстояние и дирекционный угол между двумя точками по их координатам.','Координаты X, Y обеих точек.','ΔX = X₂ − X₁; ΔY = Y₂ − Y₁; S = √(ΔX² + ΔY²); α = atan2(ΔY, ΔX).'],
 ['traverse','Теодолитный ход','Рассчитывает координаты пунктов по измеренным горизонтальным углам и длинам сторон; контролирует угловую и линейную невязки.','Исходные координаты и направление, измеренные углы, горизонтальные расстояния; для разомкнутого хода — известные конечные данные, если они есть.','Последовательно определяются направления и приращения координат, затем невязки и поправки по выбранной схеме.'],
 ['arbitrary','Произвольный ход','Помогает работать с произвольной схемой точек, известными направлениями, углами и расстояниями.','Список точек, известные координаты, ориентированные направления, углы с указанием вершины и визирных точек, измеренные расстояния.','Последовательное распространение направлений и координат с проверкой противоречий. Это не строгое уравнивание сети.'],
 ['level','Нивелирование','Вычисляет превышения и отметки по задним и передним отсчётам, отображает схему станций и контролирует невязку.','Начальная отметка, отсчёты по рейкам на каждой станции, расстояния; при наличии — конечная известная отметка и допуск.','h = a − b; Hслед = Hпред + h; невязка = Σh − (Hкон − Hнач).'],
 ['total','Тахеометр','Переводит наклонное расстояние и вертикальный отсчёт в горизонтальное проложение и превышение, затем вычисляет координаты и отметку.','Координаты и отметка станции, ориентирование, горизонтальный и вертикальный отсчёты, наклонное расстояние, высоты прибора и отражателя.','S = D·cos v; ΔH = D·sin v + i − r; ΔX = S·cos α; ΔY = S·sin α. Уточни тип вертикального угла в настройках.'],
 ['stake','Разбивка и вынос точек','Вычисляет направление и расстояние для выноса проектной точки от станции; при вводе фактической точки показывает смещения относительно проекта.','Координаты станции, ориентира и проектной точки; необязательно — фактической точки.','S = √(ΔX² + ΔY²); угол поворота = αпроект − αориент; смещения определяются проекциями отклонений на направление выноса.'],
 ['journal','Электронный полевой журнал','Хранит измерения тахеометра по точкам и вычисляет координаты и отметки для каждой записи.','Координаты и отметка станции, высота прибора, ориентирование; для каждой точки — Hz, Z или v, наклонное расстояние, высота отражателя.','Для каждой строки выполняется расчёт горизонтального проложения, превышения, направления и координат.'],
 ['slope','Уклоны и проектные отметки','Рассчитывает уклон, проектную отметку на заданном пикетаже и разницу между фактической и проектной отметками.','Начальная и конечная отметки, горизонтальное расстояние, исходная проектная отметка, проектный уклон и удаление.','i = (H₂ − H₁)/S; Hпроект(x) = H₀ + i·x; рабочая отметка = Hфакт − Hпроект.'],
 ['exchange','DXF и CSV — каталог точек','Позволяет загружать и проверять координаты точек из CSV, а затем выгружать каталог в CSV или простой DXF для CAD.','CSV со столбцами name, x, y и необязательным h; координаты в метрах.','Проверяются числовые координаты и уникальность имён. В DXF: CAD X = геодезическое Y, CAD Y = геодезическое X.']
 ];
 const oldHomePage=home;
 home=function(){oldHomePage();document.title='Rasschet 0.1';const hero=app.querySelector('.hero');if(hero){const flower=hero.querySelector('.flower');if(flower)flower.remove();const tag=hero.querySelector('.tag');if(tag)tag.remove();const logo=hero.querySelector('.logo');if(logo)logo.textContent='Rasschet 0.1';const caption=hero.querySelector('div[style*="margin-bottom"]');if(caption){caption.className='hero-caption';caption.removeAttribute('style');caption.textContent='ГЕОДЕЗИЧЕСКИЕ ИНСТРУМЕНТЫ · ОФЛАЙН'}}const cards=app.querySelector('.cards');if(cards)cards.insertAdjacentHTML('afterend','<div class="guide-easter-wrap"><img class="guide-easter-mascot" src="/guide_mascot.png" alt="Пиксельная девочка сидит на верхнем краю справочника" aria-hidden="true"><button class="help-entry" data-action="guide">ⓘ &nbsp; Справочник по разделам <span>Что делает каждая функция →</span></button></div>')};
 function helpPage(){section='guide';project=null;result=null;dirty=false;app.innerHTML='<div class="fade"><div class="help-top"><button class="back" data-action="home" aria-label="На главную">‹</button><h1>Справочник</h1></div><div class="panel"><h3>Как пользоваться Rasschet 0.1</h3><p class="muted">Здесь описаны все разделы, необходимые исходные данные и основные формулы. Выбери нужный инструмент на главной странице, создай проект и введи свои измерения.</p>'+guide.map(([key,name,purpose,inputs,formula])=>'<article class="help-section"><h4>'+esc(name)+'</h4><p>'+esc(purpose)+'</p><p><b>Что вводить:</b> '+esc(inputs)+'</p><p><b>Расчёт:</b> '+esc(formula)+'</p><button class="btn soft" data-action="section" data-type="'+key+'">Открыть раздел →</button></article>').join('')+'<div class="notice"><b>Проекты и история</b><br>В каждом разделе есть собственный каталог проектов: создать, открыть, удалить, импортировать или экспортировать JSON. В проекте доступны расчёт, чертёж и история изменений. Для сохранности данных регулярно делай резервную копию JSON.</div><div class="notice" style="margin-top:12px"><b>Чертежи</b><br>После расчёта используй кнопки масштаба, перемещай схему пальцем и нажимай на точки или линии для просмотра данных. Схема может иметь условный масштаб.</div><p class="muted">Перед полевым применением проверяй единицы, тип вертикального угла, ориентирование, систему координат и результаты контрольными измерениями.</p></div></div>'}
 document.addEventListener('click',function(e){const t=e.target.closest('[data-action="guide"]');if(t){e.stopImmediatePropagation();helpPage()}},true);
 const originalEditor=editor;
 editor=function(content){originalEditor(content);const top=app.querySelector('.top');if(top&&!top.querySelector('.help-mini'))top.insertAdjacentHTML('beforeend','<button class="help-mini" data-action="guide" aria-label="Справочник">ⓘ Справка</button>')};
 const originalProjects=projects;
 projects=function(t){originalProjects(t);const top=app.querySelector('.top');if(top&&!top.querySelector('.help-mini'))top.insertAdjacentHTML('beforeend','<button class="help-mini" data-action="guide">ⓘ Справка</button>')};
 const badge=document.querySelector('.version-badge');if(badge)badge.textContent='Rasschet 0.1';
 home();
})();
</script></body></html>
