[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  included_files = ["private/app.html"]

[[redirects]]
  from = "/ios-app"
  to = "/.netlify/functions/ios-app"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/telegram-webhook"
  to = "/.netlify/functions/telegram-webhook"
  status = 200

[[redirects]]
  from = "/set-webhook"
  to = "/.netlify/functions/set-webhook"
  status = 200
